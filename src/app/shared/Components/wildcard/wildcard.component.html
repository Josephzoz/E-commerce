<section
  class="relative min-h-[calc(100vh-140px)] sm:min-h-[calc(100vh-100px)] flex flex-col items-center justify-center px-4 sm:px-6 lg:px-8 py-12 sm:py-16 overflow-hidden bg-white select-none"
>
  <div
    class="absolute top-12 sm:top-20 left-6 sm:left-16 md:left-28 -rotate-12 text-emerald-400/20 pointer-events-none select-none transition-transform duration-700 hover:scale-110"
  >
    <i class="fa-solid fa-apple-whole text-4xl sm:text-5xl md:text-6xl"></i>
  </div>

  <div
    class="absolute top-[60%] sm:top-[58%] left-4 sm:left-12 md:left-24 rotate-12 text-emerald-400/20 pointer-events-none select-none transition-transform duration-700 hover:scale-110"
  >
    <i class="fa-solid fa-lemon text-4xl sm:text-5xl md:text-6xl"></i>
  </div>

  <div
    class="absolute bottom-10 left-10 sm:left-24 md:left-40 -rotate-45 text-emerald-400/15 pointer-events-none select-none"
  >
    <i class="fa-solid fa-leaf text-2xl sm:text-3xl"></i>
  </div>

  <div
    class="absolute top-14 sm:top-24 right-8 sm:right-16 md:right-32 rotate-12 text-emerald-400/20 pointer-events-none select-none transition-transform duration-700 hover:scale-110"
  >
    <i class="fa-solid fa-carrot text-4xl sm:text-5xl md:text-6xl"></i>
  </div>

  <div
    class="absolute top-[50%] right-6 sm:right-14 md:right-28 -rotate-12 text-emerald-400/20 pointer-events-none select-none transition-transform duration-700 hover:scale-110"
  >
    <i class="fa-solid fa-fish text-3xl sm:text-4xl md:text-5xl"></i>
  </div>

  <div
    class="absolute bottom-16 sm:bottom-20 right-10 sm:right-24 md:right-40 rotate-45 text-emerald-400/20 pointer-events-none select-none transition-transform duration-700 hover:scale-110"
  >
    <i class="fa-solid fa-seedling text-3xl sm:text-4xl"></i>
  </div>

  <div class="relative z-10 w-full max-w-4xl mx-auto flex flex-col items-center text-center">
    <div class="relative">
      <div
        class="w-48 sm:w-56 h-36 sm:h-44 bg-white rounded-3xl shadow-[0_12px_40px_-10px_rgba(22,163,74,0.12),0_4px_16px_-2px_rgba(0,0,0,0.04)] border border-gray-100/90 flex items-center justify-center p-6 sm:p-8 transition-transform duration-300 hover:scale-[1.02]"
      >
        <svg
          class="w-20 h-20 sm:w-24 sm:h-24 text-emerald-400 fill-current"
          viewBox="0 0 96 96"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path
            d="M16 24c0-2 1.6-3.6 3.6-3.6h6.8c1.8 0 3.3 1.3 3.6 3.1l1.8 8.5h44.6c2.5 0 4.3 2.3 3.7 4.7l-2 8c-.4 1.9-2.1 3.3-4.1 3.3H35.2l-1.8-8h38.2l1-4H32.6c-1.8 0-3.3-1.3-3.6-3.1L26.4 24H19.6c-2 0-3.6-1.6-3.6-3.6z"
          />

          <rect x="36" y="52" width="39" height="13" rx="5" />

          <circle cx="43" cy="76" r="5.5" />
          <circle cx="67" cy="76" r="5.5" />
        </svg>
      </div>

      <div
        class="absolute -top-3 -right-3 sm:-top-4 sm:-right-4 w-13 h-13 sm:w-16 sm:h-16 rounded-full bg-[#16a34a] text-white flex items-center justify-center font-bold text-base sm:text-lg shadow-lg shadow-[#16a34a]/30 ring-4 ring-white select-none"
      >
        404
      </div>
    </div>

    <div
      class="flex items-center justify-center gap-3 mt-6 text-emerald-400 select-none"
      aria-hidden="true"
    >
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
      <svg
        class="w-6 h-3 text-emerald-400"
        viewBox="0 0 20 10"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
      >
        <path d="M2 2c3.2 5.5 12.8 5.5 16 0" />
      </svg>
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>
    </div>

    <h1
      class="text-3xl sm:text-4xl md:text-5xl font-black text-gray-900 tracking-tight mt-6 sm:mt-7 mb-3 text-center"
    >
      Oops! Nothing Here
    </h1>

    <p
      class="text-gray-500 text-sm sm:text-base text-center max-w-md mx-auto leading-relaxed mb-8 px-2"
    >
      Looks like this page went out of stock! Don't worry,
      <span class="block sm:inline">there's plenty more fresh content to explore.</span>
    </p>

    <div
      class="flex flex-col sm:flex-row items-center justify-center gap-3.5 sm:gap-4 w-full sm:w-auto mb-12 sm:mb-14"
    >
      <a
        routerLink="/home"
        class="inline-flex items-center justify-center gap-2.5 w-full sm:w-auto px-6 py-3.5 sm:px-7 sm:py-3.5 bg-[#16a34a] hover:bg-[#15803d] text-white font-medium text-sm sm:text-base rounded-2xl shadow-sm hover:shadow-md transition-all duration-200 active:scale-95 cursor-pointer"
      >
        <i class="fa-solid fa-house text-sm"></i>
        <span>Go to Homepage</span>
      </a>

      <button
        type="button"
        (click)="goBack()"
        class="inline-flex items-center justify-center gap-2.5 w-full sm:w-auto px-6 py-3.5 sm:px-7 sm:py-3.5 bg-white hover:bg-gray-50 text-gray-700 font-medium text-sm sm:text-base rounded-2xl border border-gray-200 shadow-xs hover:shadow-sm transition-all duration-200 active:scale-95 cursor-pointer"
      >
        <i class="fa-solid fa-arrow-left text-sm"></i>
        <span>Go Back</span>
      </button>
    </div>

    <div
      class="w-full max-w-xl md:max-w-2xl bg-white/80 backdrop-blur-xs rounded-2xl sm:rounded-3xl border border-gray-100/90 shadow-xs px-5 py-5 sm:px-8 sm:py-6"
    >
      <p
        class="text-[11px] sm:text-xs font-bold tracking-widest text-gray-400 uppercase text-center mb-4 select-none"
      >
        POPULAR DESTINATIONS
      </p>

      <div class="flex flex-wrap items-center justify-center gap-2.5 sm:gap-3">
        <a
          routerLink="/shop"
          class="px-4 py-2 sm:px-5 sm:py-2.5 rounded-xl bg-green-50/90 hover:bg-green-100/90 text-[#16a34a] font-medium text-xs sm:text-sm border border-green-100/70 transition-colors"
        >
          All Products
        </a>

        <a
          routerLink="/categories"
          class="px-4 py-2 sm:px-5 sm:py-2.5 rounded-xl bg-gray-50/90 hover:bg-gray-100 text-gray-600 hover:text-gray-900 font-medium text-xs sm:text-sm border border-transparent transition-colors"
        >
          Categories
        </a>

        <a
          routerLink="/shop"
          class="px-4 py-2 sm:px-5 sm:py-2.5 rounded-xl bg-gray-50/90 hover:bg-gray-100 text-gray-600 hover:text-gray-900 font-medium text-xs sm:text-sm border border-transparent transition-colors"
        >
          Today's Deals
        </a>

        <a
          routerLink="/contact"
          class="px-4 py-2 sm:px-5 sm:py-2.5 rounded-xl bg-gray-50/90 hover:bg-gray-100 text-gray-600 hover:text-gray-900 font-medium text-xs sm:text-sm border border-transparent transition-colors"
        >
          Contact Us
        </a>
      </div>
    </div>
  </div>
</section>
