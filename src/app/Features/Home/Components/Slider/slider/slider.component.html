<swiper-container
  class="mySwiper max-md:[&::part(button-prev)]:!hidden max-md:[&::part(button-next)]:!hidden"
  navigation="true"
  [pagination]="{ clickable: true }"
> 
  <swiper-slide>
    <div class="landing">
      <div class="item flex items-center py-12 md:py-16">
        <div class="slider-content max-w-xl">
          <div class="caption">
            <h1 class="font-bold text-white text-2xl sm:text-3xl md:text-4xl leading-tight">
              Fresh Products Delivered <br />
              to your Door
            </h1>
            <p class="text-white/90 text-sm sm:text-base md:text-lg font-normal my-3 md:my-4">
              Get 20% off your first order
            </p>
          </div>
          <div class="item-buttons flex flex-row items-center gap-3 my-4">
            <button
            routerLink="/shop"
              class="px-5 sm:px-6 py-2.5 rounded-lg cursor-pointer bg-white text-[#00C950] font-semibold text-sm sm:text-base hover:bg-gray-100 transition-all duration-200 shadow-sm"
            >
              Shop Now
            </button>
            <button
              class="px-5 sm:px-6 py-2.5 rounded-lg cursor-pointer border border-white text-white font-semibold text-sm sm:text-base hover:bg-white/15 transition-all duration-200"
            >
              View Deals
            </button>
          </div>
        </div>
      </div>
    </div>
  </swiper-slide>

  <swiper-slide>
    <div class="landing">
      <div class="item flex items-center py-12 md:py-16">
        <div class="slider-content max-w-xl">
          <div class="caption">
            <h1 class="font-bold text-white text-2xl sm:text-3xl md:text-4xl leading-tight">
              Premium Quality <br />
              Guaranteed
            </h1>
            <p class="text-white/90 text-sm sm:text-base md:text-lg font-normal my-3 md:my-4">
              Fresh from farm to your table
            </p>
          </div>
          <div class="item-buttons flex flex-row items-center gap-3 my-4">
            <button
            routerLink="/shop"
              class="px-5 sm:px-6 py-2.5 rounded-lg cursor-pointer bg-white text-[#00C950] font-semibold text-sm sm:text-base hover:bg-gray-100 transition-all duration-200 shadow-sm"
            >
              Shop Now
            </button>
            <button
              class="px-5 sm:px-6 py-2.5 rounded-lg cursor-pointer border border-white text-white font-semibold text-sm sm:text-base hover:bg-white/15 transition-all duration-200"
            >
              Learn More
            </button>
          </div>
        </div>
      </div>
    </div>
  </swiper-slide>

  <swiper-slide>
    <div class="landing">
      <div class="item flex items-center py-12 md:py-16">
        <div class="slider-content max-w-xl">
          <div class="caption">
            <h1 class="font-bold text-white text-2xl sm:text-3xl md:text-4xl leading-tight">
              Fast & Free Delivery
            </h1>
            <p class="text-white/90 text-sm sm:text-base md:text-lg font-normal my-3 md:my-4">
              Same day delivery available
            </p>
          </div>
          <div class="item-buttons flex flex-row items-center gap-3 my-4">
            <button
            routerLink="/shop"
              class="px-5 sm:px-6 py-2.5 rounded-lg cursor-pointer bg-white text-[#00C950] font-semibold text-sm sm:text-base hover:bg-gray-100 transition-all duration-200 shadow-sm"
            >
              Order Now
            </button>
            <button
              class="px-5 sm:px-6 py-2.5 rounded-lg cursor-pointer border border-white text-white font-semibold text-sm sm:text-base hover:bg-white/15 transition-all duration-200"
            >
              Delivery Info
            </button>
          </div>
        </div>
      </div>
    </div>
  </swiper-slide>
</swiper-container>
