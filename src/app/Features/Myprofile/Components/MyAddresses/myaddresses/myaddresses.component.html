<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
  <div>
    <h2 class="text-xl sm:text-2xl font-bold text-gray-900 tracking-tight">My Addresses</h2>
    <p class="text-xs sm:text-sm text-gray-500 mt-1">Manage your saved delivery addresses</p>
  </div>

  <button
    type="button"
    (click)="openModal()"
    class="inline-flex items-center justify-center gap-2 px-4 sm:px-5 py-2.5 rounded-xl bg-[#16A34A] hover:bg-[#15803d] text-white text-sm sm:text-base font-semibold shadow-xs hover:shadow-md transition-all duration-200 cursor-pointer self-start sm:self-auto"
  >
    <i class="fa-solid fa-plus text-sm"></i>
    <span>Add Address</span>
  </button>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-5">
  @for (address of userAddresses(); track address._id) {
    <div
      class="bg-white rounded-2xl p-4 sm:p-5 border border-gray-100 shadow-xs hover:shadow-md transition-all duration-200"
    >
      <div class="flex items-start justify-between gap-3 sm:gap-4">
        <div class="flex items-start gap-3 sm:gap-4 min-w-0 flex-1">
          <div
            class="w-10 h-10 sm:w-11 sm:h-11 rounded-xl bg-emerald-50 text-[#16A34A] flex items-center justify-center shrink-0"
          >
            <i class="fa-solid fa-location-dot text-base sm:text-lg"></i>
          </div>

          <div class="min-w-0 flex-1">
            <h3 class="text-base font-bold text-gray-900 leading-snug">
              {{ address.name }}
            </h3>
            <p class="text-xs sm:text-sm text-gray-500 mt-1 leading-relaxed break-words">
              {{ address.details }}
            </p>

            <div
              class="flex flex-wrap items-center gap-x-4 gap-y-1.5 text-xs sm:text-sm text-gray-500 mt-3"
            >
              <span class="inline-flex items-center gap-1.5">
                <i class="fa-solid fa-phone text-xs text-gray-400"></i>
                <span>{{ address.phone }}</span>
              </span>
              <span class="inline-flex items-center gap-1.5">
                <i class="fa-solid fa-city text-xs text-gray-400"></i>
                <span>{{ address.city }}</span>
              </span>
            </div>
          </div>
        </div>

        <div class="flex items-center gap-1.5 shrink-0">
          <button
            type="button"
            title="Edit Address"
            class="w-8 h-8 rounded-lg bg-gray-100 hover:bg-gray-200/80 text-gray-600 hover:text-gray-900 flex items-center justify-center transition-colors cursor-pointer"
          >
            <i class="fa-solid fa-pen text-xs"></i>
          </button>
          <button
            (click)="deleteAddress(address._id)"
            type="button"
            title="Delete Address"
            class="w-8 h-8 rounded-lg bg-gray-100 hover:bg-red-50 text-gray-600 hover:text-red-600 flex items-center justify-center transition-colors cursor-pointer"
          >
            <i class="fa-solid fa-trash text-xs"></i>
          </button>
        </div>
      </div>
    </div>
  }
</div>

@if (isModalOpen()) {
  <div
    (click)="closeModal()"
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-xs p-4"
  >
    <div
      (click)="$event.stopPropagation()"
      class="bg-white rounded-3xl shadow-2xl w-full max-w-lg p-6 sm:p-8 relative transition-all"
    >
      <div class="flex items-center justify-between mb-6">
        <h3 class="text-xl font-bold text-gray-900 tracking-tight">Add New Address</h3>
        <button
          type="button"
          (click)="closeModal()"
          class="w-8 h-8 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-500 hover:text-gray-700 flex items-center justify-center transition-colors cursor-pointer"
        >
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>

      <form class="space-y-4" [formGroup]="newAddressForm" (ngSubmit)="addNewAddress()">
        <div>
          <label class="block text-sm font-semibold text-gray-800 mb-1.5"> Address Name </label>
          <input
            formControlName="name"
            type="text"
            placeholder="e.g. Home, Office"
            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-[#16A34A] focus:ring-1 focus:ring-[#16A34A] text-gray-900 placeholder:text-gray-400 text-sm transition-all"
          />
        </div>

        <div>
          <label class="block text-sm font-semibold text-gray-800 mb-1.5"> Full Address </label>
          <textarea
            formControlName="details"
            rows="3"
            placeholder="Street, building, apartment..."
            class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-[#16A34A] focus:ring-1 focus:ring-[#16A34A] text-gray-900 placeholder:text-gray-400 text-sm resize-none transition-all"
          ></textarea>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-gray-800 mb-1.5"> Phone Number </label>
            <input
              formControlName="phone"
              type="tel"
              placeholder="01xxxxxxxxx"
              class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-[#16A34A] focus:ring-1 focus:ring-[#16A34A] text-gray-900 placeholder:text-gray-400 text-sm transition-all"
            />
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-800 mb-1.5"> City </label>
            <input
              formControlName="city"
              type="text"
              placeholder="Cairo"
              class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:border-[#16A34A] focus:ring-1 focus:ring-[#16A34A] text-gray-900 placeholder:text-gray-400 text-sm transition-all"
            />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3.5 pt-4">
          <button
            type="button"
            (click)="closeModal()"
            class="w-full py-3 px-4 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-semibold transition-colors cursor-pointer text-center"
          >
            Cancel
          </button>
          <button
            type="submit"
            class="w-full py-3 px-4 rounded-xl bg-[#16A34A] hover:bg-[#15803d] text-white text-sm font-semibold shadow-xs hover:shadow-md transition-all duration-200 cursor-pointer text-center"
          >
            Add Address
          </button>
        </div>
      </form>
    </div>
  </div>
}
