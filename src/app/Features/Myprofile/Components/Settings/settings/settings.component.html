<div class="mb-6 sm:mb-8">
  <h2 class="text-xl sm:text-2xl font-bold text-gray-900 tracking-tight">Account Settings</h2>
  <p class="text-xs sm:text-sm text-gray-500 mt-1">
    Update your profile information and change your password
  </p>
</div>

<div class="flex flex-col gap-6 sm:gap-8">
  <div class="bg-white rounded-2xl border border-gray-100 shadow-xs overflow-hidden">
    <div class="p-5 sm:p-7">
      <div class="flex items-center gap-3 sm:gap-4 mb-6">
        <div
          class="w-11 h-11 rounded-2xl bg-emerald-50 text-[#16A34A] flex items-center justify-center shrink-0"
        >
          <i class="fa-solid fa-user text-lg"></i>
        </div>
        <div>
          <h3 class="text-base sm:text-lg font-bold text-gray-900 leading-snug">
            Profile Information
          </h3>
          <p class="text-xs sm:text-sm text-gray-500 mt-0.5">Update your personal details</p>
        </div>
      </div>

      <form>
        <div class="space-y-4 sm:space-y-5">
          <div>
            <label class="block text-xs sm:text-sm font-medium text-gray-700 mb-1.5">
              Full Name
            </label>
            <input
              type="text"
              value="Joseph Ashraf"
              class="w-full px-4 py-2.5 sm:py-3 rounded-xl border border-gray-200 text-sm sm:text-base text-gray-900 focus:outline-none focus:ring-2 focus:ring-[#16A34A]/20 focus:border-[#16A34A] transition-colors shadow-2xs"
            />
          </div>

          <div>
            <label class="block text-xs sm:text-sm font-medium text-gray-700 mb-1.5">
              Email Address
            </label>
            <input
              type="email"
              placeholder="Enter your email"
              class="w-full px-4 py-2.5 sm:py-3 rounded-xl border border-gray-200 text-sm sm:text-base text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#16A34A]/20 focus:border-[#16A34A] transition-colors shadow-2xs"
            />
          </div>

          <div>
            <label class="block text-xs sm:text-sm font-medium text-gray-700 mb-1.5">
              Phone Number
            </label>
            <input
              type="tel"
              placeholder="01xxxxxxxxx"
              class="w-full px-4 py-2.5 sm:py-3 rounded-xl border border-gray-200 text-sm sm:text-base text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#16A34A]/20 focus:border-[#16A34A] transition-colors shadow-2xs"
            />
          </div>
        </div>

        <div class="mt-6">
          <button
            type="submit"
            class="inline-flex items-center gap-2 px-5 py-2.5 sm:py-3 rounded-xl bg-[#16A34A] hover:bg-[#15803d] text-white text-sm sm:text-base font-semibold shadow-xs hover:shadow-md transition-all duration-200 cursor-pointer"
          >
            <i class="fa-solid fa-floppy-disk text-sm"></i>
            <span>Save Changes</span>
          </button>
        </div>
      </form>
    </div>

    <div class="border-t border-gray-100 bg-gray-50/50 p-5 sm:p-7">
      <h4 class="text-sm sm:text-base font-bold text-gray-900 mb-4">Account Information</h4>
      <div class="space-y-3">
        <div class="flex items-center justify-between text-xs sm:text-sm">
          <span class="text-gray-500">User ID</span>
          <span class="text-gray-400 font-medium">—</span>
        </div>
        <div class="flex items-center justify-between text-xs sm:text-sm">
          <span class="text-gray-500">Role</span>
          <span class="px-2.5 py-0.5 rounded-md bg-emerald-50 text-[#16A34A] text-xs font-semibold">
            User
          </span>
        </div>
      </div>
    </div>
  </div>

  <div class="bg-white rounded-2xl border border-gray-100 shadow-xs p-5 sm:p-7">
    <div class="flex items-center gap-3 sm:gap-4 mb-6">
      <div
        class="w-11 h-11 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center shrink-0"
      >
        <i class="fa-solid fa-lock text-lg"></i>
      </div>
      <div>
        <h3 class="text-base sm:text-lg font-bold text-gray-900 leading-snug">Change Password</h3>
        <p class="text-xs sm:text-sm text-gray-500 mt-0.5">Update your account password</p>
      </div>
    </div>

    <form [formGroup]="changePasswordForm" (ngSubmit)="changePassword()">
      <div class="space-y-4 sm:space-y-5">
        <div>
          <label class="block text-xs sm:text-sm font-medium text-gray-700 mb-1.5">
            Current Password
          </label>
          <div class="relative">
            <input
              formControlName="currentPassword"
              type="password"
              placeholder="Enter your current password"
              class="w-full px-4 py-2.5 sm:py-3 pr-10 rounded-xl border border-gray-200 text-sm sm:text-base text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#16A34A]/20 focus:border-[#16A34A] transition-colors shadow-2xs"
            />
            <button
              type="button"
              class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors cursor-pointer"
            >
              <i class="fa-regular fa-eye text-sm"></i>
            </button>
          </div>
        </div>

        <div>
          <label class="block text-xs sm:text-sm font-medium text-gray-700 mb-1.5">
            New Password
          </label>
          <div class="relative">
            <input
              formControlName="password"
              type="password"
              placeholder="Enter your new password"
              class="w-full px-4 py-2.5 sm:py-3 pr-10 rounded-xl border border-gray-200 text-sm sm:text-base text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#16A34A]/20 focus:border-[#16A34A] transition-colors shadow-2xs"
            />
            <button
              type="button"
              class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors cursor-pointer"
            >
              <i class="fa-regular fa-eye text-sm"></i>
            </button>
          </div>
          <p class="text-[11px] sm:text-xs text-gray-400 mt-1.5">Must be at least 6 characters</p>
        </div>

        <div>
          <label class="block text-xs sm:text-sm font-medium text-gray-700 mb-1.5">
            Confirm New Password
          </label>
          <div class="relative">
            <input
              formControlName="rePassword"
              type="password"
              placeholder="Confirm your new password"
              class="w-full px-4 py-2.5 sm:py-3 pr-10 rounded-xl border border-gray-200 text-sm sm:text-base text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#16A34A]/20 focus:border-[#16A34A] transition-colors shadow-2xs"
            />
            <button
              type="submit"
              class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors cursor-pointer"
            >
              <i class="fa-regular fa-eye text-sm"></i>
            </button>
          </div>
        </div>
      </div>

      <div class="mt-6">
        <button
          type="submit"
          class="inline-flex items-center gap-2 px-5 py-2.5 sm:py-3 rounded-xl bg-[#EA580C] hover:bg-[#C2410C] text-white text-sm sm:text-base font-semibold shadow-xs hover:shadow-md transition-all duration-200 cursor-pointer"
        >
          <i class="fa-solid fa-lock text-sm"></i>
          <span>Change Password</span>
        </button>
      </div>
    </form>
  </div>
</div>
