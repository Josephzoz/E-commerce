
<section class="bg-gradient-to-r from-[#16A34A] via-[#22C55E] to-[#4ADE80] text-white py-8 sm:py-10 lg:py-12 shadow-xs">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8">

    <nav aria-label="Breadcrumb" class="mb-4 sm:mb-5">
      <ol class="flex items-center gap-2 text-xs sm:text-sm font-medium">
        <li>
          <a routerLink="/home" class="text-white/80 hover:text-white transition-colors duration-200">
            Home
          </a>
        </li>
        <li class="text-white/60" aria-hidden="true">/</li>
        <li class="text-white font-semibold" aria-current="page">
          All Products
        </li>
      </ol>
    </nav>

  
    <div class="flex items-center gap-3.5 sm:gap-4 md:gap-5">

      <div
        class="w-12 h-12 sm:w-14 sm:h-14 md:w-16 md:h-16 rounded-2xl bg-white/20 backdrop-blur-xs flex items-center justify-center shrink-0 border border-white/10 shadow-xs"
      >
        <i class="fa-solid fa-box-open text-xl sm:text-2xl md:text-3xl text-white"></i>
      </div>

     
      <div>
        <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold text-white tracking-tight leading-tight">
          All Products
        </h1>
        <p class="text-xs sm:text-sm md:text-base text-white/90 font-normal mt-0.5 sm:mt-1">
          Explore our complete product collection
        </p>
      </div>
    </div>
  </div>
</section>


<section class="py-6 sm:py-8 lg:py-10 bg-gray-50/50 min-h-screen">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8">
  
    <div class="mb-4 sm:mb-6">
      <p class="text-xs sm:text-sm font-medium text-gray-500">
        Showing {{ products().length }} products
      </p>
    </div>


    <app-products [products]="products()"></app-products>
  </div>
</section>
