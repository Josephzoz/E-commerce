<section
  class="bg-gradient-to-r from-[#7F22FE] via-[#8E51FF] to-[#C27AFF] text-white py-8 sm:py-10 lg:py-12 shadow-xs"
>
  <div class="container mx-auto px-4 sm:px-6 lg:px-8">
    <nav aria-label="Breadcrumb" class="mb-4 sm:mb-5">
      <ol class="flex items-center gap-2 text-xs sm:text-sm font-medium">
        <li>
          <a
            routerLink="/home"
            class="text-white/80 hover:text-white transition-colors duration-200"
          >
            Home
          </a>
        </li>
        <li class="text-white/60" aria-hidden="true">/</li>
        <li class="text-white font-semibold" aria-current="page">Brands</li>
      </ol>
    </nav>

    <div class="flex items-center gap-3.5 sm:gap-4 md:gap-5">
      <div
        class="w-12 h-12 sm:w-14 sm:h-14 md:w-16 md:h-16 rounded-2xl bg-white/20 backdrop-blur-xs flex items-center justify-center shrink-0 border border-white/10 shadow-xs"
      >
        <i class="fa-solid fa-box-open text-xl sm:text-2xl md:text-3xl text-white"></i>
      </div>

      <div>
        <h1
          class="text-2xl sm:text-3xl md:text-4xl font-bold text-white tracking-tight leading-tight"
        >
          Top Brands
        </h1>
        <p class="text-xs sm:text-sm md:text-base text-white/90 font-normal mt-0.5 sm:mt-1">
          Shop from your favorite brands
        </p>
      </div>
    </div>
  </div>
</section>

<section class="py-6 sm:py-8 lg:py-10 bg-gray-50/50 min-h-screen">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8 max-w-7xl">
    <div
      class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4 sm:gap-5 lg:gap-6"
    >
      @for (brand of allBrands(); track brand._id) {
        <a
          [routerLink]="['/products', 'brand', brand._id]"
          class="group bg-white rounded-2xl border border-gray-100 hover:border-[#7F22FE]/40 shadow-xs hover:shadow-xl transition-all duration-300 p-3 sm:p-4 flex flex-col items-center justify-between text-center cursor-pointer hover:-translate-y-1.5 relative hover:z-10"
        >
          <div
            class="w-full h-32 sm:h-36 md:h-40 rounded-xl bg-gray-50 flex items-center justify-center p-4 mb-2.5 overflow-hidden transition-colors duration-200 group-hover:bg-purple-50/30"
          >
            <img
              [src]="brand.image"
              [alt]="brand.name"
              class="w-full h-full object-contain group-hover:scale-105 transition-transform duration-300"
              loading="lazy"
            />
          </div>
          <div class="w-full flex flex-col items-center">
            <h3
              class="text-sm sm:text-base font-semibold text-gray-800 group-hover:text-[#7F22FE] transition-colors duration-200 line-clamp-1"
            >
              {{ brand.name }}
            </h3>
            <div class="h-6 mt-1 flex items-center justify-center">
              <span
                class="text-xs font-medium text-[#7F22FE] flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-all duration-200 transform translate-y-1 group-hover:translate-y-0"
              >
                View Products <i class="fa-solid fa-arrow-right text-[10px]"></i>
              </span>
            </div>
          </div>
        </a>
      }
    </div>
  </div>
</section>
