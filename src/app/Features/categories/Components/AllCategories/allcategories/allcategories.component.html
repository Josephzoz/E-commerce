<section
  class="bg-gradient-to-r from-[#16A34A] via-[#22C55E] to-[#4ADE80] text-white py-8 sm:py-10 lg:py-12 shadow-xs"
>
  <div class="container mx-auto px-4 sm:px-6 lg:px-8">

    <nav aria-label="Breadcrumb" class="mb-4 sm:mb-5">
      <ol class="flex items-center gap-2 text-xs sm:text-sm font-medium">
        <li>
          <a
            routerLink="/home"
            class="text-white/80 hover:text-white transition-colors duration-200"
          >
            Home
          </a>
        </li>
        <li class="text-white/60" aria-hidden="true">/</li>
        <li class="text-white font-semibold" aria-current="page">Categories</li>
      </ol>
    </nav>

    
    <div class="flex items-center gap-3.5 sm:gap-4 md:gap-5">
      
      <div
        class="w-12 h-12 sm:w-14 sm:h-14 md:w-16 md:h-16 rounded-2xl bg-white/20 backdrop-blur-xs flex items-center justify-center shrink-0 border border-white/10 shadow-xs"
      >
       
        <i class="fa-solid fa-layer-group text-xl sm:text-2xl md:text-3xl text-white"></i>
      </div>

      
      <div>
        <h1
          class="text-2xl sm:text-3xl md:text-4xl font-bold text-white tracking-tight leading-tight"
        >
          All Categories
        </h1>
        <p class="text-xs sm:text-sm md:text-base text-white/90 font-normal mt-0.5 sm:mt-1">
          Browse our wide range of product categories
        </p>
      </div>
    </div>
  </div>
</section>
<section class="py-8 sm:py-10 lg:py-12 bg-white min-h-[calc(100vh-80px)]">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8 max-w-7xl">
   
    <div
      class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-5 lg:gap-6"
    >
      
      @for (category of categories(); track category._id) {
        <a
          [routerLink]="['subcategories',category._id]"
          class="group bg-white rounded-2xl border border-gray-100 hover:border-emerald-500 shadow-xs hover:shadow-lg transition-all duration-300 p-3 sm:p-3.5 flex flex-col items-center justify-between text-center cursor-pointer hover:-translate-y-1"
        >
          <div
            class="w-full h-32 sm:h-36 md:h-50 rounded-xl overflow-hidden mb-2.5 bg-gray-50 flex items-center justify-center"
          >
            <img
              [src]="category.image"
              [alt]="category.name"
              class="w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-300"
              loading="lazy"
            />
          </div>
          <div class="w-full flex flex-col items-center">
            <h3
              class="text-sm sm:text-base font-semibold text-gray-800 group-hover:text-emerald-600 transition-colors duration-200 line-clamp-1"
            >
              {{ category.name }}
            </h3>
            <div class="h-8 mt-0.5 flex items-center justify-center">
              <span
                class="text-xs font-medium text-emerald-600 flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity duration-200"
              >
                View Subcategories <i class="fa-solid fa-arrow-right text-[10px]"></i>
              </span>
            </div>
          </div>
        </a>
      }
    </div>
  </div>
</section>
