<section class="min-h-screen bg-gray-50/50 py-6 sm:py-8 lg:py-10">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8 max-w-7xl">
    <nav
      class="flex items-center text-xs sm:text-sm text-gray-500 gap-1.5 mb-5 sm:mb-6"
      aria-label="Breadcrumb"
    >
      <a
        routerLink="/home"
        class="hover:text-emerald-600 transition-colors font-medium text-gray-500"
        >Home</a
      >
      <span class="text-gray-400 select-none">/</span>
      <span class="font-medium text-gray-800">All Orders</span>
    </nav>

    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 sm:mb-8">
      <div class="flex items-center gap-3.5">
        <div
          class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-emerald-600 flex items-center justify-center text-white shadow-xs shrink-0"
        >
          <i class="fa-solid fa-box-archive text-xl sm:text-2xl"></i>
        </div>
        <div>
          <h1
            class="text-2xl sm:text-3xl font-extrabold text-gray-900 tracking-tight leading-tight"
          >
            All Orders
          </h1>
          <p class="text-xs sm:text-sm text-gray-500 mt-0.5">Track and manage your 8 orders</p>
        </div>
      </div>

      <a
        routerLink="/shop"
        class="inline-flex items-center gap-2 text-emerald-600 hover:text-emerald-700 font-semibold text-xs sm:text-sm transition-colors self-start sm:self-auto"
      >
        <i class="fa-solid fa-bag-shopping"></i>
        <span>Continue Shopping</span>
      </a>
    </div>
    <app-orders [orders]="allOrders()"></app-orders>
  </div>
</section>
